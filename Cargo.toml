[workspace]
members = ["tools/basis-shim"]

[package]
name = "scarlet-nexus-assets"
version = "0.1.0"
edition = "2024"
publish = false
description = "Conversor modular de malhas e texturas para GLB leve"

[dependencies]
png = "0.17"
serde_json = "1"
thiserror = "2"
basis-shim = { path = "tools/basis-shim", optional = true }

[dev-dependencies]
gltf = { version = "1.4", default-features = false }
ktx2 = "0.5"

[features]
pc-ktx2-basis = ["dep:basis-shim"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
